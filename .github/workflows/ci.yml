name: CI

# Run on every push and PR so the project is provably green from a clean checkout.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies (from uv.lock)
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        # Network/browser integration tests are opt-in (DOCFORGE_NETWORK_TESTS)
        # and stay skipped here, so CI needs no headless browser.
        run: uv run pytest
